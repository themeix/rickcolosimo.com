backend:
  name: github
  repo: rickcolosimo/rickcolosimo
  branch: main
  base_url: https://api.decapcms.org
  auth_endpoint: auth

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  # Blog Posts Collection
  - name: "posts"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss ZZ", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "Author", name: "author", widget: "string", default: "Rick Colosimo" }
      - { label: "Permalink", name: "permalink", widget: "string", required: false, hint: "E.g. /my-post-title/" }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Categories", name: "categories", widget: "list", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "SEO Title", name: "seo_title", widget: "string", required: false }
      - { label: "Meta Description", name: "meta_description", widget: "string", required: false }
      - { label: "Canonical URL", name: "canonical_url", widget: "string", required: false }
      - { label: "Body Content", name: "body", widget: "markdown" }

  # Pages Collection
  - name: "pages"
    label: "Pages"
    folder: "_pages"
    create: true
    slug: "{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
      - { label: "Page Title", name: "title", widget: "string" }
      - { label: "Permalink", name: "permalink", widget: "string", hint: "E.g. /services/deals/" }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Main Content", name: "body", widget: "markdown" }

  # Site Settings Collection
  - name: "settings"
    label: "Site Settings"
    delete: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "General Settings & Contact Info"
        file: "_data/settings.yml"
        fields:
          - { label: "Site Title", name: "title", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Site Description", name: "description", widget: "text" }
          - { label: "Author Name", name: "author", widget: "string" }
          - { label: "Contact Email", name: "email", widget: "string" }
          - { label: "Contact Phone", name: "phone", widget: "string" }
          - { label: "Mailing Address", name: "address", widget: "string" }
          - { label: "Twitter URL", name: "twitter_url", widget: "string" }
          - { label: "LinkedIn URL", name: "linkedin_url", widget: "string" }
          - { label: "Facebook URL", name: "facebook_url", widget: "string" }
          - { label: "Copyright Start Year", name: "copyright_year_start", widget: "string" }
          - { label: "Footer Credit Text", name: "footer_credit", widget: "string" }
          - { label: "Footer Credit URL", name: "footer_credit_url", widget: "string" }

      - name: "navigation"
        label: "Navigation Menus"
        file: "_data/navigation.yml"
        fields:
          - label: "Main Header Menu"
            name: "main"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
              - label: "Submenu Items"
                name: "children"
                widget: "list"
                required: false
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
          - label: "Footer Director Services Links"
            name: "footer_director_services"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Footer About Rick Links"
            name: "footer_about_rick"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Footer Other Links"
            name: "footer_other"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
