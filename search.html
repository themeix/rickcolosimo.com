---
layout: default
title: Search
permalink: /search/
---
<div class="max-w-[1300px] mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="flex flex-col lg:flex-row gap-12">
    
    <!-- Main Content Column -->
    <div class="w-full lg:w-[78%] lg:pr-12 lg:border-r lg:border-dotted lg:border-[#bbbbbb]">
      <h1 class="font-serif font-bold text-3xl sm:text-4xl text-black leading-tight mb-8">
        Search Results
      </h1>

      <div class="mb-8">
        <input type="search" id="search-input" placeholder="Search articles..." class="w-full px-4 py-3 bg-white border-2 border-gray-300 focus:border-[#98012f] text-gray-700 outline-none text-base">
      </div>

      <div id="search-results" class="space-y-12">
        <p class="text-gray-500 font-sans">Loading search index...</p>
      </div>
    </div>

    <!-- Sidebar Column -->
    <div class="w-full lg:w-[22%]">
      {% include sidebar.html %}
    </div>

  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function() {
  const input = document.getElementById('search-input');
  const container = document.getElementById('search-results');
  const urlParams = new URLSearchParams(window.location.search);
  const initialQuery = urlParams.get('q') || urlParams.get('s') || '';

  if (initialQuery) {
    input.value = initialQuery;
  }

  let posts = [];
  try {
    const res = await fetch('{{ "/search.json" | relative_url }}');
    posts = await res.json();
    renderResults(input.value.trim().toLowerCase());
  } catch (err) {
    container.innerHTML = '<p class="text-red-600">Failed to load search index.</p>';
    return;
  }

  input.addEventListener('input', function() {
    renderResults(input.value.trim().toLowerCase());
  });

  function renderResults(q) {
    if (!q) {
      container.innerHTML = '<p class="text-gray-600">Please enter a search term above.</p>';
      return;
    }

    const matches = posts.filter(p => {
      return p.title.toLowerCase().includes(q) || 
             p.excerpt.toLowerCase().includes(q) || 
             (p.tags && p.tags.some(t => t.toLowerCase().includes(q)));
    });

    if (matches.length === 0) {
      container.innerHTML = `<p class="text-gray-600">No articles found matching "<strong>${escapeHtml(q)}</strong>".</p>`;
      return;
    }

    container.innerHTML = `
      <p class="text-sm text-gray-500 mb-6 font-sans">Found ${matches.length} result(s) for "${escapeHtml(q)}":</p>
      ${matches.map(p => `
        <article class="pb-8 border-b border-dotted border-[#bbbbbb]">
          <h2 class="font-serif font-bold text-2xl sm:text-3xl text-[#98012f] mb-2">
            <a href="${p.url}" class="text-[#98012f] hover:underline">${escapeHtml(p.title)}</a>
          </h2>
          <div class="text-xs text-gray-500 mb-4 font-sans">
            By ${escapeHtml(p.author || 'Rick Colosimo')} / ${p.date} / Comments Off
          </div>
          <div class="text-base text-gray-700 leading-relaxed font-sans mb-4">
            ${escapeHtml(p.excerpt)}
          </div>
          <div class="text-right">
            <a href="${p.url}" class="post-read-more-link">Read More</a>
          </div>
        </article>
      `).join('')}
    `;
  }

  function escapeHtml(str) {
    return str.replace(/[&<>'"]/g, tag => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      "'": '&#39;',
      '"': '&quot;'
    }[tag] || tag));
  }
});
</script>
