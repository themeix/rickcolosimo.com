<header class="bg-white border-b border-gray-100">
  {% include navigation.html %}

  <div class="max-w-[1300px] mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-0">
    <div class="mb-4">
      <h1 class="font-serif font-bold text-4xl sm:text-5xl lg:text-[54px] tracking-[5px] text-black m-0 leading-tight">
        <a href="{{ '/' | relative_url }}" class="text-black hover:text-black no-underline hover:no-underline">{{ site.data.settings.title | default: site.title }}</a>
      </h1>
      <h3 class="font-sans text-xs sm:text-sm uppercase tracking-[4px] text-gray-600 mt-2 font-normal">
        <a href="{{ '/' | relative_url }}" class="text-gray-600 hover:text-gray-600 no-underline hover:no-underline">{{ site.data.settings.tagline | default: site.tagline }}</a>
      </h3>
    </div>

    <!-- Signature Brand Accent Band (Beaver Builder recreation) -->
    <div class="relative w-full mt-8">
      <!-- Inner gold accent bar -->
      <div class="w-[80%] border-b-[40px] sm:border-b-[60px] lg:border-b-[75px] border-[#d5ae65] -mb-[32px] sm:-mb-[48px] lg:-mb-[60px] relative z-10"></div>
      <!-- Outer burgundy accent bar spanning full width -->
      <div class="w-full border-b-[40px] sm:border-b-[60px] lg:border-b-[75px] border-[#98012f]"></div>
    </div>
  </div>
</header>
